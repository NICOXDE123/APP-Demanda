[project]
name = "proyecta"
version = "0.2.0"
description = "Proyecta — APP Gestión de la Demanda y Oportunidades (Build & Impact 2026, equipo Heavy-Duty)"
requires-python = ">=3.12"
# Lo que usa el MVP de la Entrega 2; Datastore, Secret Manager y openpyxl entran con su tarea (T002).
dependencies = [
    "argon2-cffi==25.1.0",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "tzdata==2025.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "httpx2==2.16.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
proyecta = ["interfaces/web/templates/**/*.html", "interfaces/web/static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
