            type: object
            required: [mes, backlog_contractual, mab, forecast, hc]
            properties:
              mes:
                type: string
                pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
              backlog_contractual:
                type: integer
              mab:
                type: integer
              forecast:
                type: integer
              hc:
                type: integer
    CalidadResumen:
      type: object
      required: [rojos, amarillos, verdes]
      properties:
        rojos:
          type: integer
        amarillos:
          type: integer
        verdes:
          type: integer
    Calidad:
      type: object
      required: [registros]
      properties:
        registros:
          type: array
          items:
            type: object
            required: [registro_id, semaforo, hallazgos]
            properties:
              registro_id:
                type: string
                format: uuid
              semaforo:
                type: string
                enum: [ROJO, AMARILLO, VERDE]
              hallazgos:
                type: array
                items:
                  type: object
                  required: [regla, severidad]
                  properties:
                    regla:
                      type: string
                    severidad:
                      type: string
                      enum: [ROJO, AMARILLO, INFORMATIVO]
    Corte:
      type: object
      required: [id, periodo_referencia, estado, version, fecha_corte]
      properties:
        id:
          type: string
        periodo_referencia:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        estado:
          type: string
          enum: [CREANDO, CERRADO, ERROR]
        version:
          type: integer
        fecha_corte:
          type: string
          format: date-time
    CorteRequest:
      type: object
      required: [periodo_referencia]
      properties:
        periodo_referencia:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        motivo:
          type: string
          maxLength: 300
    Puente:
      type: object
      required: [corte_base, corte_contra, variacion_total, categorias, redondeo]
      properties:
        corte_base:
          type: string
        corte_contra:
          type: string
        variacion_total:
          type: integer
        categorias:
          type: array
          items:
            type: object
            required: [categoria, monto]
            properties:
              categoria:
                type: string
                enum:
                  - NUEVOS
                  - CERRADOS
                  - BASE
                  - PROBABILIDAD
                  - CONFIABILIDAD
                  - PARAMETROS
                  - BACKLOG
                  - HORIZONTE
              monto:
                type: integer
        redondeo:
          type: integer
    SimulacionRequest:
      type: object
      required: [periodo]
      properties:
        periodo:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        probabilidad:
          type: number
          minimum: 0
          maximum: 1
        confiabilidad:
          type: number
          minimum: 0
          maximum: 1
        horas_mensuales:
          type: integer
          minimum: 1
        excluir_registro_ids:
          type: array
          items:
            type: string
            format: uuid
    SimulacionResponse:
      type: object
      required: [etiqueta, periodo, meses]
      properties:
        etiqueta:
          type: string
          const: simulado
        periodo:
          type: string
        meses:
          type: array
          items:
            type: object
            additionalProperties: true
    Sugerencia:
      type: object
      required: [id, registro_id, campo, valor_sugerido, estado, version_prompt]
      properties:
        id:
          type: string
          format: uuid
        registro_id:
          type: string
          format: uuid
        campo:
          type: string
        valor_sugerido:
          type: object
          additionalProperties: true
        cita_bitacora_id:
          type: string
          format: uuid
        estado:
          type: string
          enum: [PENDIENTE, ACEPTADA, DESCARTADA]
        revisor_id:
          type: string
          format: uuid
        version_prompt:
          type: string
    RegistroPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Registro'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        trace_id:
          type: string
  responses:
    NoAutorizado:
      description: Sesión ausente o vencida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Prohibido:
      description: Rol o propiedad insuficientes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoEncontrado:
      description: Recurso inexistente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MetodoNoPermitido:
      description: La bitácora y la auditoría no admiten edición ni borrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflicto:
      description: Versión desactualizada o estado incompatible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Validacion:
      description: Error de validación de campos o reglas
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DemasiadosIntentos:
      description: Cuenta o IP bloqueada por intentos fallidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
