openapi: 3.1.0
info:
  title: Proyecta API
  version: 1.0.0
  description: |
    Contrato REST del MVP de Proyecta. La autenticación es por sesión de servidor
    (cookie HttpOnly). Las rutas de bitácora y auditoría no exponen PUT ni DELETE:
    una corrección es una entrada nueva y el servidor responde 405 a esos métodos.
    No existe migración real en el MVP; la carga inicial es sintética y se ejecuta
    fuera de esta API.
servers:
  - url: /api/v1
tags:
  - name: Auth
    description: Sesión, cierre de sesión y usuario actual
  - name: Registros
    description: Oportunidades, demandas y continuidades
  - name: Perfiles
    description: Perfiles, HC y tarifas
  - name: Estados
    description: Transiciones de estado y flujo
  - name: Bitacora
    description: Seguimiento cronológico inmutable
  - name: Auditoria
    description: Consulta de eventos de auditoría
  - name: Backlog
    description: Contratos de continuidad
  - name: Metas
    description: Metas comerciales y gap
  - name: Dashboard
    description: Indicadores y series
  - name: Calidad
    description: Semáforo y pendientes
  - name: Cortes
    description: Cierre de período y puente
  - name: Simulacion
    description: Escenarios sin persistencia
  - name: IA
    description: Sugerencias con aprobación humana
  - name: Exportacion
    description: Exportación a Excel
security:
  - sessionCookie: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada
          headers:
            Set-Cookie:
              description: Cookie de sesión HttpOnly, Secure y SameSite=Strict
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionResponse'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Cerrar sesión
      responses:
        '204':
          description: Sesión cerrada
        '401':
          $ref: '#/components/responses/NoAutorizado'
  /auth/me:
    get:
      tags: [Auth]
      summary: Usuario y CSRF de la sesión actual
      responses:
        '200':
          description: Sesión vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionResponse'
        '401':
          $ref: '#/components/responses/NoAutorizado'
  /registros:
    get:
      tags: [Registros]
      summary: Listar registros con filtros y paginación
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/OwnerId'
        - $ref: '#/components/parameters/SectorId'
        - $ref: '#/components/parameters/Estado'
        - $ref: '#/components/parameters/Tipo'
        - $ref: '#/components/parameters/Flujo'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/FechaDesde'
        - $ref: '#/components/parameters/FechaHasta'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroPage'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
    post:
      tags: [Registros]
      summary: Crear una oportunidad, demanda o continuidad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroCreate'
      responses:
        '201':
          description: Registro creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registro'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/Validacion'
  /registros/{id}:
    parameters:
      - $ref: '#/components/parameters/RegistroId'
    get:
      tags: [Registros]
      summary: Obtener un registro
      responses:
        '200':
          description: Registro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registro'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    patch:
      tags: [Registros]
      summary: Actualizar un registro con control de versión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroUpdate'
      responses:
        '200':
          description: Registro actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registro'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/Validacion'
  /registros/{id}/estado:
    parameters:
      - $ref: '#/components/parameters/RegistroId'
    post:
      tags: [Estados]
      summary: Cambiar de estado con motivo y fecha efectiva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoRequest'
      responses:
        '200':
          description: Transición aplicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registro'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/Validacion'
  /registros/{id}/flujo:
    parameters:
      - $ref: '#/components/parameters/RegistroId'
    post:
      tags: [Estados]
      summary: Cambiar de etapa comercial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlujoRequest'
      responses:
        '200':
          description: Flujo actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registro'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/Validacion'
  /registros/{id}/perfiles:
    parameters:
      - $ref: '#/components/parameters/RegistroId'
    get:
      tags: [Perfiles]
      summary: Listar perfiles del registro
      responses:
        '200':
          description: Perfiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Perfil'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
    post:
      tags: [Perfiles]
      summary: Agregar un perfil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerfilCreate'
      responses:
        '201':
          description: Perfil creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/Validacion'
  /registros/{id}/perfiles/{perfilId}:
    parameters:
      - $ref: '#/components/parameters/RegistroId'
      - $ref: '#/components/parameters/PerfilId'
    patch:
      tags: [Perfiles]
      summary: Actualizar o dar de baja un perfil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerfilUpdate'
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/Validacion'
  /registros/{id}/tarifas:
    parameters:
      - $ref: '#/components/parameters/RegistroId'
    get:
      tags: [Perfiles]
      summary: Listar tarifas del registro
      responses:
        '200':
          description: Tarifas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tarifa'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
    post:
      tags: [Perfiles]
      summary: Agregar una tarifa con vigencia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TarifaCreate'
      responses:
        '201':
          description: Tarifa creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarifa'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/Validacion'
  /registros/{id}/bitacora:
    parameters:
      - $ref: '#/components/parameters/RegistroId'
    get:
      tags: [Bitacora]
      summary: Consultar la bitácora
      responses:
        '200':
          description: Entradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BitacoraEntry'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '405':
          $ref: '#/components/responses/MetodoNoPermitido'
    post:
      tags: [Bitacora]
      summary: Agregar una entrada de bitácora
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BitacoraCreate'
      responses:
        '201':
          description: Entrada creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitacoraEntry'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/Validacion'
  /registros/{id}/auditoria:
    parameters:
      - $ref: '#/components/parameters/RegistroId'
    get:
      tags: [Auditoria]
      summary: Consultar la auditoría del registro
      parameters:
        - $ref: '#/components/parameters/Campo'
        - $ref: '#/components/parameters/FechaDesde'
        - $ref: '#/components/parameters/FechaHasta'
      responses:
        '200':
          description: Eventos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventoAuditoria'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '405':
          $ref: '#/components/responses/MetodoNoPermitido'
  /contratos:
    get:
      tags: [Backlog]
      summary: Listar contratos de continuidad
      responses:
        '200':
          description: Contratos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contrato'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
    post:
      tags: [Backlog]
      summary: Crear un contrato de continuidad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContratoCreate'
      responses:
        '201':
          description: Contrato creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contrato'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/Validacion'
  /contratos/{id}:
    parameters:
      - $ref: '#/components/parameters/RegistroId'
    get:
      tags: [Backlog]
      summary: Obtener un contrato
      responses:
        '200':
          description: Contrato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contrato'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    patch:
      tags: [Backlog]
      summary: Actualizar un contrato
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContratoUpdate'
      responses:
        '200':
          description: Contrato actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contrato'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/Validacion'
  /metas:
    get:
      tags: [Metas]
      summary: Listar metas
      parameters:
        - $ref: '#/components/parameters/SectorId'
        - $ref: '#/components/parameters/Mes'
      responses:
        '200':
          description: Metas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
    post:
      tags: [Metas]
      summary: Crear o actualizar una meta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetaUpsert'
      responses:
        '200':
          description: Meta guardada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/Validacion'
  /metas/{sectorId}/{mes}:
    parameters:
      - $ref: '#/components/parameters/SectorIdPath'
      - $ref: '#/components/parameters/MesPath'
    get:
      tags: [Metas]
      summary: Obtener la meta de un sector y mes
      responses:
        '200':
          description: Meta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    put:
      tags: [Metas]
      summary: Reemplazar la meta de un sector y mes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetaUpsert'
      responses:
        '200':
          description: Meta guardada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/Validacion'
  /parametros:
    get:
      tags: [Dashboard]
      summary: Listar parámetros vigentes e históricos
      responses:
        '200':
          description: Parámetros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Parametro'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
    post:
      tags: [Dashboard]
      summary: Crear una nueva vigencia de parámetro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParametroCreate'
      responses:
        '201':
          description: Parámetro creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parametro'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/Validacion'
  /catalogos:
    get:
      tags: [Dashboard]
      summary: Listar catálogos activos
      parameters:
        - $ref: '#/components/parameters/TipoCatalogo'
      responses:
        '200':
          description: Catálogos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Catalogo'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
  /usuarios:
    get:
      tags: [Auth]
      summary: Listar usuarios (Operaciones)
      responses:
        '200':
          description: Usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
    post:
      tags: [Auth]
      summary: Crear usuario (Operaciones)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCreate'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/Validacion'
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Indicadores del dashboard con filtros y detalle
      parameters:
        - $ref: '#/components/parameters/Periodo'
        - $ref: '#/components/parameters/SectorId'
        - $ref: '#/components/parameters/OwnerId'
        - $ref: '#/components/parameters/Tipo'
        - $ref: '#/components/parameters/Estado'
      responses:
        '200':
          description: Indicadores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
  /forecast:
    get:
      tags: [Dashboard]
      summary: Serie de Forecast de 12 meses
      parameters:
        - $ref: '#/components/parameters/Periodo'
        - $ref: '#/components/parameters/SectorId'
      responses:
        '200':
          description: Serie mensual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forecast'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
  /calidad:
    get:
      tags: [Calidad]
      summary: Semáforo y pendientes de calidad
      parameters:
        - $ref: '#/components/parameters/OwnerId'
      responses:
        '200':
          description: Calidad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calidad'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
  /cortes:
    get:
      tags: [Cortes]
      summary: Listar cortes
      responses:
        '200':
          description: Cortes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Corte'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
    post:
      tags: [Cortes]
      summary: Cerrar un período
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorteRequest'
      responses:
        '202':
          description: Cierre iniciado; el corte queda en estado CREANDO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Corte'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/Validacion'
  /cortes/{id}/puente:
    parameters:
      - $ref: '#/components/parameters/CorteId'
      - $ref: '#/components/parameters/CorteContra'
    get:
      tags: [Cortes]
      summary: Comparar dos cortes y descomponer la variación
      responses:
        '200':
          description: Puente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Puente'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
  /simulaciones:
    post:
      tags: [Simulacion]
      summary: Calcular un escenario sin persistir ni cambiar estados
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulacionRequest'
      responses:
        '200':
          description: Resultado rotulado como simulado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulacionResponse'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/Validacion'
  /sugerencias:
    get:
      tags: [IA]
      summary: Listar sugerencias pendientes
      responses:
        '200':
          description: Sugerencias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sugerencia'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
  /sugerencias/{id}/aceptar:
    parameters:
      - $ref: '#/components/parameters/SugerenciaId'
    post:
      tags: [IA]
      summary: Aceptar una sugerencia con aprobación humana
      responses:
        '200':
          description: Sugerencia aceptada y auditada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sugerencia'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
